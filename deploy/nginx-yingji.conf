server {
    listen 80;
    listen [::]:80;
    server_name yingji.kivelo0017.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 154.36.178.96:443 ssl http2;
    server_name yingji.kivelo0017.xyz;

    ssl_certificate /etc/letsencrypt/live/yingji.kivelo0017.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yingji.kivelo0017.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Yingji private ledger";
    auth_basic_user_file /etc/nginx/yingji.htpasswd;

    client_max_body_size 8m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
